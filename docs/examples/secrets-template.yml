# GitHub Secrets Configuration Template
# This file provides templates for different deployment scenarios
# 
# IMPORTANT: This file is for documentation only
# Actual secrets must be configured in GitHub:
# Settings → Secrets and variables → Actions

---
# DEVELOPMENT CONFIGURATION
# Use for initial testing with personal email

development:
  EMAIL_USERNAME: "your.personal@gmail.com"
  EMAIL_PASSWORD: "[16-char Gmail app password]"
  EMAIL_TO: "your.personal@gmail.com"
  
  notes: |
    - Use your personal Gmail for initial testing
    - Generate app password at https://myaccount.google.com/apppasswords
    - Recipient is yourself to avoid spamming team
    - Test thoroughly before moving to staging

---
# STAGING CONFIGURATION  
# Use for testing with limited team before full production

staging:
  EMAIL_USERNAME: "monitoring@ancoris.com"
  EMAIL_PASSWORD: "[production app password]"
  EMAIL_TO: "developer@ancoris.com,team-lead@ancoris.com"
  
  notes: |
    - Uses production email account
    - Limited recipient list (2-3 people)
    - Test with team leads first
    - Validate formatting and delivery
    - Get feedback before production rollout

---
# PRODUCTION CONFIGURATION
# Full production deployment to all team members

production:
  EMAIL_USERNAME: "monitoring@ancoris.com"
  EMAIL_PASSWORD: "[production app password]"
  EMAIL_TO: "team@ancoris.com,it@ancoris.com"
  
  notes: |
    - Production email account
    - Full team distribution lists
    - team@ancoris.com: All team members
    - it@ancoris.com: IT support for escalations
    - Ensure all recipients confirmed before deployment

---
# GMAIL CONFIGURATION EXAMPLE
# For teams using Gmail / G Suite

gmail_example:
  EMAIL_USERNAME: "alerts@company.com"
  EMAIL_PASSWORD: "abcdefghijklmnop"  # 16 characters, no spaces
  EMAIL_TO: "team@company.com"
  
  smtp_details:
    server: "smtp.gmail.com"
    port: 587
    encryption: "TLS"
  
  setup_steps:
    - "Enable 2FA: https://myaccount.google.com/security"
    - "Generate app password: https://myaccount.google.com/apppasswords"
    - "Copy 16-character password (remove spaces)"
    - "Add to GitHub Secrets"

---
# OUTLOOK CONFIGURATION EXAMPLE
# For teams using Outlook.com or Hotmail

outlook_example:
  EMAIL_USERNAME: "monitoring@outlook.com"
  EMAIL_PASSWORD: "[app password from Microsoft]"
  EMAIL_TO: "team@company.com"
  
  smtp_details:
    server: "smtp-mail.outlook.com"
    port: 587
    encryption: "TLS"
  
  setup_steps:
    - "Enable 2-step verification: https://account.microsoft.com/security"
    - "Create app password in security settings"
    - "Copy generated password"
    - "Add to GitHub Secrets"

---
# OFFICE 365 CONFIGURATION EXAMPLE
# For teams using Office 365 business accounts

office365_example:
  EMAIL_USERNAME: "alerts@company.com"
  EMAIL_PASSWORD: "[app password or regular password]"
  EMAIL_TO: "team@company.com"
  
  smtp_details:
    server: "smtp.office365.com"
    port: 587
    encryption: "TLS"
  
  setup_steps:
    - "Check with IT if SMTP authentication is enabled"
    - "Request app password or SMTP relay access"
    - "May require IP whitelisting for GitHub Actions"
    - "Alternative: Use SMTP relay server"
  
  notes: |
    Many organizations disable SMTP authentication.
    Contact IT department for proper configuration.

---
# CORPORATE EMAIL CONFIGURATION EXAMPLE
# For teams using custom email servers

corporate_example:
  EMAIL_USERNAME: "monitoring@ancoris.com"
  EMAIL_PASSWORD: "[provided by IT department]"
  EMAIL_TO: "team@ancoris.com,it@ancoris.com"
  
  smtp_details:
    server: "[provided by IT]"
    port: 587  # or 465, 25
    encryption: "TLS"  # or SSL
  
  setup_steps:
    - "Contact IT: it@ancoris.com"
    - "Request SMTP access for GitHub Actions"
    - "Obtain server hostname, port, and credentials"
    - "Check for IP whitelisting requirements"
    - "Verify approved sender and recipient addresses"

---
# MULTI-TIER NOTIFICATION EXAMPLE
# Different recipients based on alert severity

multi_tier_example:
  # Base configuration
  EMAIL_USERNAME: "monitoring@company.com"
  EMAIL_PASSWORD: "[app password]"
  
  # Different recipient tiers (configure multiple EMAIL_TO_* secrets)
  EMAIL_TO_INFO: "team@company.com"
  EMAIL_TO_WARNING: "team@company.com,leads@company.com"
  EMAIL_TO_CRITICAL: "team@company.com,it@company.com"
  EMAIL_TO_EMERGENCY: "team@company.com,it@company.com,management@company.com"
  
  notes: |
    Create separate secrets for different alert levels:
    - EMAIL_TO_INFO for informational alerts
    - EMAIL_TO_WARNING for warnings
    - EMAIL_TO_CRITICAL for critical issues
    - EMAIL_TO_EMERGENCY for emergencies
    
    Workflow can choose appropriate recipient list based on severity.

---
# TESTING CHECKLIST
# Validate your configuration before production

testing_checklist:
  personal_test:
    - "Set EMAIL_USERNAME to your personal email"
    - "Set EMAIL_PASSWORD to your app password"
    - "Set EMAIL_TO to your personal email"
    - "Run test-email.yml workflow"
    - "Verify email received"
    - "Check spam folder if not in inbox"
    - "Verify email formatting"
  
  staging_test:
    - "Update to staging credentials"
    - "Limit recipients to 2-3 team members"
    - "Notify staging team"
    - "Run test workflow"
    - "Collect feedback"
    - "Fix any issues"
  
  production_deployment:
    - "Update to production credentials"
    - "Update to full recipient list"
    - "Notify full team 24 hours in advance"
    - "Run test workflow"
    - "Monitor delivery"
    - "Collect team feedback"

---
# SECURITY REMINDERS

security_notes: |
  ⚠️ IMPORTANT SECURITY PRACTICES:
  
  1. NEVER commit actual credentials to code
     - This template is for reference only
     - Real secrets go in GitHub Settings
  
  2. ALWAYS use app passwords
     - Never use regular email passwords
     - Enable 2-factor authentication first
     - Generate app-specific passwords
  
  3. Store backups securely
     - Use team password manager (1Password, LastPass, etc.)
     - Document in secure team wiki
     - Multiple people should have access
  
  4. Rotate credentials regularly
     - Every 90 days for production
     - When team members leave
     - After security incidents
  
  5. Limit access appropriately
     - Only admins can manage secrets
     - Use distribution lists, not individual addresses
     - Review recipient lists quarterly
  
  6. Monitor and audit
     - Check workflow logs regularly
     - Review email delivery reports
     - Audit secret access (if available)
  
  For complete security guide, see: docs/SECURITY_BEST_PRACTICES.md

---
# QUICK REFERENCE

quick_setup:
  step_1: "Go to repository Settings"
  step_2: "Click 'Secrets and variables' → 'Actions'"
  step_3: "Click 'New repository secret'"
  step_4: "Add EMAIL_USERNAME (your email address)"
  step_5: "Add EMAIL_PASSWORD (app password, not regular password!)"
  step_6: "Add EMAIL_TO (recipient address or comma-separated list)"
  step_7: "Go to Actions tab"
  step_8: "Run 'Test Email Configuration' workflow"
  step_9: "Check your inbox for test email"
  step_10: "See GITHUB_SECRETS_SETUP.md for detailed instructions"

---
# TROUBLESHOOTING

common_issues:
  authentication_failed:
    problem: "535 Authentication failed"
    solutions:
      - "Verify EMAIL_PASSWORD is app password, not regular password"
      - "Check 2-factor authentication is enabled"
      - "Regenerate app password"
      - "Verify no typos in EMAIL_USERNAME"
  
  connection_timeout:
    problem: "Connection timeout or SMTP error"
    solutions:
      - "Verify SMTP server and port are correct"
      - "Check GitHub Actions has network access"
      - "Try different port (587, 465)"
      - "Contact IT if using corporate email"
  
  email_to_spam:
    problem: "Email delivered but goes to spam"
    solutions:
      - "Have recipients mark as 'Not Spam'"
      - "Add sender to contacts"
      - "Check SPF/DKIM records (contact IT)"
      - "Avoid spam trigger words in content"
  
  no_email_received:
    problem: "Workflow succeeds but email not received"
    solutions:
      - "Check spam folder"
      - "Verify EMAIL_TO address is correct"
      - "Check for typos in recipient address"
      - "Wait 5-10 minutes for delivery"
      - "Check workflow logs for errors"

